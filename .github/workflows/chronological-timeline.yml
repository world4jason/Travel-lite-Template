name: Chronological Timeline Contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Install Chromium for rendered UIUX tests
        run: npx playwright install --with-deps chromium
      - name: Static UIUX Lint
        run: npm run lint:uiux
      - name: Rendered UIUX geometry
        run: npm run test:uiux:geometry
      - name: Enforce mandatory UI/UX contract and agent references
        run: npm run test:uiux
      - name: Date/weather and flight projection contracts
        run: npm run test:trip-widgets
      - name: Verify door-to-door Journeys and Maps URLs
        run: npm run test:journey
      - name: Desktop Journey browser reflow
        run: npm run test:journey:browser
      - name: Compact Trip Overview static contract
        run: npm run test:overview
      - name: Compact Overview browser regression across visual styles
        run: npm run test:overview:browser
      - name: Storybook layout and quiet-copy source contract
        run: npm run test:trip-layout
      - name: Render Storybook trip cards across phone/desktop widths
        run: npm run test:trip-layout:browser
      - name: Places classification and source-backed guides
        run: npm run test:places-curation
      - name: Places curated guide browser QA
        run: npm run test:places-curation:browser
      - name: Enforce canonical time-blocked itinerary
        run: npm run test:timeline
      - name: Check globally unique item IDs
        run: npm run test:integrity
