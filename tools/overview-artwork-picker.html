<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Lite · 主視覺選材</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background:#faf9f6; color:#262c2b; }
    * { box-sizing:border-box; }
    body { margin:0 auto; padding:24px 16px 64px; max-width:860px; }
    h1 { font-size:1.5rem; letter-spacing:-.03em; }
    h2 { font-size:1.1rem; }
    p, small { color:#495853; }
    .control { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .formgrid { display:grid; gap:10px; }
    .choice { display:flex; align-items:flex-start; gap:12px; padding:12px 15px; border:1px solid #d5d9d5; border-radius:10px; background:white; cursor:pointer; }
    .choice input { margin-top:5px; flex:none; width:18px; height:18px; accent-color:#305b4a; }
    .choice strong { display:block; font-weight:600; overflow-wrap:anywhere; }
    .choice small { display:block; margin-top:2px; }
    .panel { padding:16px; border:1px solid #d5d9d5; border-radius:12px; background:white; margin:16px 0; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    button { appearance:none; background:#244d3b; color:white; font:inherit; padding:10px 14px; border:0; border-radius:8px; cursor:pointer; min-height:44px; }
    button:focus-visible, .choice:focus-within { outline:3px solid #a3b9cf; outline-offset:3px; }
    textarea { width:100%; min-height:190px; font:13px/1.5 ui-monospace,monospace; resize:vertical; margin-top:12px; border:1px solid #9caaa3; border-radius:8px; padding:12px; }
    .error { color:#9b2727; }
    @media (min-width:760px) {.formgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }}
  </style>
</head>
<body>
  <h1>旅程主視覺選材</h1>
  <p>由建立行程的人選擇 1–6 個真實行程事件或景點，產出 1–3 張插畫的製作需求。這是發布前工具，不會修改網站、產生圖片或更動行程。</p>
  <div class="panel control">
    <label for="image-count">插畫張數</label>
    <select id="image-count" aria-label="插畫張數">
      <option value="1">1 張（推薦）</option><option value="2">2 張</option><option value="3">3 張</option>
    </select>
    <span id="trip-name"></span>
  </div>
  <h2>選擇代表這趟旅行的時刻</h2>
  <div id="choices" class="formgrid" aria-live="polite">讀取 trip.json…</div>
  <div class="panel">
    <div id="status" role="status">最多選 6 個時刻；可以選活動、景點、特別的住宿或休息。</div>
    <div class="actions">
      <button id="make-brief" type="button">產生製作需求</button>
      <button id="download-brief" type="button">下載 JSON</button>
    </div>
    <textarea id="result" readonly aria-label="可複製的製作需求 JSON"></textarea>
  </div>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let trip;
      let rows = [];
      function currentSelection() { return [...document.querySelectorAll('input[data-item-id]:checked')].map(el => el.dataset.itemId); }
      function changeStatus() {
        const count = currentSelection().length;
        $('status').textContent = '已選 ' + count + ' / 6 個代表時刻';
        $('status').className = count > 6 ? 'error' : '';
      }
      async function load() {
        try {
          const res = await fetch('../trip.json', { cache:'no-store' });
          if (!res.ok) throw new Error('trip.json HTTP ' + res.status);
          trip = await res.json();
          rows = (trip.days || []).flatMap(day => (day.items || []).filter(item =>
            ['place','attraction','sight','museum','landmark','nature','event','break','stay'].includes(item.type)
          ).map(item => ({ id:item.id, date:day.date, type:item.type, title:item.title })));
          $('trip-name').textContent = trip.trip?.title || '';
          const selected = new Set(trip.trip?.overviewArtwork?.subjectIds || []);
          const root=$('choices');root.replaceChildren();
          for (const row of rows) {
            const label=document.createElement('label');label.className='choice';
            const cb=document.createElement('input'); cb.type='checkbox';cb.dataset.itemId=row.id;cb.checked=selected.has(row.id);
            cb.addEventListener('change', () => {
              if (currentSelection().length>6) { cb.checked=false; $('status').textContent='最多 6 個時刻'; $('status').className='error'; return; }
              changeStatus();
            });
            const span=document.createElement('span'), title=document.createElement('strong'), meta=document.createElement('small');
            title.textContent=row.title; meta.textContent=row.date+' · '+row.type;
            span.append(title,meta);label.append(cb,span);root.append(label);
          }
          changeStatus();
        } catch(error) { $('choices').textContent = '無法讀取行程：'+error.message; }
      }
      function brief() {
        const ids=currentSelection(); if(!trip || ids.length<1 || ids.length>6) {
          $('status').textContent='請選擇 1–6 個代表時刻'; $('status').className='error';return null;
        }
        const selection = rows.filter(row=>ids.includes(row.id));
        const value = {tripId:trip.trip?.id, visualStyle:trip.ui?.visualStyle||'editorial',
          imageCount:Number($('image-count').value), subjectIds:ids, selectedItems:selection,
          instruction:'Use selected itinerary moments to produce owner-reviewed images; keep exact events/places and attribution. No live website generation. Publish 1-3 local assets as trip.overviewArtwork.images after QA.'};
        $('result').value=JSON.stringify(value,null,2); return value;
      }
      $('make-brief').addEventListener('click', async () => {
        if(!brief())return;
        try { if (!navigator.clipboard?.writeText) throw new Error('clipboard unsupported'); await navigator.clipboard.writeText($('result').value); $('status').textContent='已複製製作需求'; $('status').className=''; }
        catch { $('result').focus(); $('result').select(); }
      });
      $('download-brief').addEventListener('click', () => {
        if(!brief())return;
        const blob=new Blob([$('result').value],{type:'application/json'});
        const url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url;a.download='overview-artwork-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      });
      load();
    })();
  </script>
</body>
</html>
