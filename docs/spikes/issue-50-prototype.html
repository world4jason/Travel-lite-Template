<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Lite #50 Visual Direction Spike</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172018;background:#e7e7e2}
*{box-sizing:border-box}body{margin:0}.toolbar{position:sticky;top:0;z-index:9;display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#171a17;color:#fff}
.toolbar button{border:1px solid #535953;background:#232823;color:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.toolbar button.active{background:#fff;color:#171a17}
.note{padding:9px 14px;background:#fff7cf;border-bottom:1px solid #dacb7f;font-size:12px}
.viewport-shell{padding:22px;overflow:auto}.viewport{transform-origin:top left;box-shadow:0 20px 70px #0003;overflow:hidden}.screen{width:100%;height:100%;padding:clamp(16px,3vw,44px)}
.mobile{width:390px;height:844px}.desktop{width:1600px;height:900px;transform:scale(.72);margin-bottom:-252px}
.cand-a{--bg:#f3f0e9;--fg:#1b1d1a;--muted:#70746e;--line:#c8c4ba;--acc:#315f4c;--panel:#faf8f3;background:var(--bg);color:var(--fg)}
[data-theme=dark] .cand-a{--bg:#151815;--fg:#f2f0e9;--muted:#a4aaa1;--line:#3d423d;--acc:#8ec7aa;--panel:#1d211d}
.cand-b{--bg:#efe8d6;--fg:#2c2b28;--muted:#716c61;--line:#b8ad94;--acc:#b14932;--panel:#f8f2e4;background:repeating-linear-gradient(0deg,#0000 0 23px,#75694918 24px),var(--bg);color:var(--fg);font-family:"Courier New",monospace}
[data-theme=dark] .cand-b{--bg:#24221d;--fg:#efe7d6;--muted:#b7ae9c;--line:#5d5547;--acc:#ef8d6d;--panel:#2d2a23}
.cand-c{--bg:#eef2f5;--fg:#111821;--muted:#66717e;--line:#c7d0d8;--acc:#0b66ff;--panel:#fff;background:var(--bg);color:var(--fg)}
[data-theme=dark] .cand-c{--bg:#0b1118;--fg:#edf3fa;--muted:#93a1af;--line:#26313d;--acc:#65a0ff;--panel:#111a24}
.screen{background:var(--bg)}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:10px;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:14px}.mast h1{margin:8px 0 3px;font-size:clamp(26px,5vw,54px);line-height:.95;letter-spacing:-.05em}.cand-a .mast h1,.cand-a .focus,.cand-a .day h3{font-family:Georgia,serif}.cand-b .mast{border-bottom:2px solid var(--fg)}.cand-b .mast h1{letter-spacing:-.035em}.cand-c .mast{border-bottom:4px solid var(--fg)}
.meta{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;margin-top:26px}.focus{font-size:clamp(38px,6vw,78px);line-height:.93;letter-spacing:-.055em;margin:12px 0}.lede{max-width:720px;color:var(--muted);line-height:1.5}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:25px 0;background:var(--line);border:1px solid var(--line)}.strip div{background:var(--panel);padding:12px}.strip b{display:block;font-size:11px}.strip span{font-size:11px;color:var(--muted)}
.sequence{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:68px 1fr auto;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.row time,.row small{font-size:11px;color:var(--muted)}
.aside{border-left:1px solid var(--line);padding-left:22px}.aside h3{font-size:22px;margin:8px 0}.aside p{color:var(--muted);font-size:13px;line-height:1.45}.decision{border-top:3px solid var(--acc);margin-top:26px;padding-top:14px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}.day{background:var(--panel);border:1px solid var(--line);padding:18px;min-height:150px}.day h3{margin:18px 0 8px;font-size:24px;line-height:1}.day p{color:var(--muted);font-size:12px}.cand-a .day{border:0;border-top:1px solid var(--line);background:transparent}.cand-b .day{border:1px solid var(--fg);box-shadow:3px 3px 0 #0001}.cand-c .day{border-left:6px solid var(--acc)}
.callout{margin-top:18px;background:var(--panel);border:1px solid var(--line);padding:18px}.cand-b .callout{border:2px dashed var(--acc)}.cand-c .callout{border-left:6px solid #e99a22}
@media(max-width:700px){.screen{padding:18px}.layout{grid-template-columns:1fr;gap:18px}.aside{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.mast h1{font-size:30px}.focus{font-size:44px}.strip{grid-template-columns:1fr}.days{grid-template-columns:1fr}.day{min-height:110px}.row{grid-template-columns:55px 1fr}.row small{grid-column:2}.desktop{transform:scale(.72)}}
</style>
</head>
<body>
<div class="toolbar">
  <button data-c="a" class="active">A · Editorial Atlas</button><button data-c="b">B · Field Journal</button><button data-c="c">C · Transit Lens</button>
  <button data-s="now" class="active">Now</button><button data-s="trip">Trip overview</button>
  <button data-t="light" class="active">Light</button><button data-t="dark">Dark</button>
  <button data-v="mobile" class="active">390×844</button><button data-v="desktop">1600×900</button>
</div>
<div class="note">Issue #50 review prototype. Same representative itinerary data in every direction. Prototype only — no production semantics.</div>
<div class="viewport-shell"><div id="viewport" class="viewport mobile"><main id="screen" class="screen cand-a"></main></div></div>
<script>
const data={
 now:`<header class="mast"><div><div class="eyebrow">Travel Lite · Tokyo</div><h1>Tokyo · 03–05 Oct</h1><div class="meta">3 days · 8 stops · offline ready</div></div><b>16:42</b></header><div class="layout"><section><div class="eyebrow">Now · Day 1</div><div class="focus">Walk to Meiji Jingu.</div><p class="lede">Harajuku → shrine approach. Keep the pace easy; the evening stays deliberately flexible.</p><div class="strip"><div><b>Weather</b><span>22° · light cloud</span></div><div><b>Next</b><span>17:30 · Shibuya</span></div><div><b>Reminder</b><span>Offline map ready</span></div></div><div class="sequence"><div class="row"><time>14:00</time><b>Arrive & drop bags</b><small>done</small></div><div class="row"><time>16:30</time><b>Meiji Jingu walk</b><small>current</small></div><div class="row"><time>17:30</time><b>Shibuya crossing</b><small>next</small></div></div></section><aside class="aside"><div class="eyebrow">Context</div><h3>First afternoon stays deliberately light.</h3><p>Previous: hotel check-in complete.</p><div class="decision"><div class="eyebrow">Open decision</div><h3>Dinner area?</h3><p>Shibuya or Ebisu — decide after the walk.</p></div></aside></div>`,
 trip:`<header class="mast"><div><div class="eyebrow">Travel Lite · Tokyo</div><h1>Tokyo · 03–05 Oct</h1><div class="meta">3 days · 8 stops · 2 open choices</div></div><b>16:42</b></header><div class="eyebrow" style="margin-top:26px">Trip overview</div><div class="focus">Tokyo, without over-planning it.</div><p class="lede">Three compact days built around neighborhoods, with flexible food choices and one clean departure morning.</p><div class="days"><article class="day"><div class="eyebrow">Day 01</div><h3>Arrival & Shibuya</h3><p>Hotel → Meiji Jingu → Shibuya</p></article><article class="day"><div class="eyebrow">Day 02</div><h3>Asakusa & Ueno</h3><p>Senso-ji → lunch choice → Ueno</p></article><article class="day"><div class="eyebrow">Day 03</div><h3>Departure</h3><p>Coffee → Haneda</p></article></div><div class="layout"><div class="callout"><div class="eyebrow">Flexible highlight</div><h3>Lunch follows the day, not the schedule.</h3><p class="meta">Keep both areas available until the morning pace is clear.</p></div><div class="callout decision"><div class="eyebrow">Unresolved</div><h3>Asakusa or Ueno?</h3><p class="meta">Choose on the day based on hunger and crowds.</p></div></div>`
};
let state={c:"a",s:"now",t:"light",v:"mobile"};
function render(){document.documentElement.dataset.theme=state.t;const s=document.querySelector("#screen");s.className="screen cand-"+state.c;s.innerHTML=data[state.s];const v=document.querySelector("#viewport");v.className="viewport "+state.v;document.querySelectorAll("button").forEach(b=>{const k=b.dataset.c?"c":b.dataset.s?"s":b.dataset.t?"t":b.dataset.v?"v":null;if(k)b.classList.toggle("active",b.dataset[k]===state[k])})}
document.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.c)state.c=b.dataset.c;if(b.dataset.s)state.s=b.dataset.s;if(b.dataset.t)state.t=b.dataset.t;if(b.dataset.v)state.v=b.dataset.v;render()});render();
</script>
</body></html>
